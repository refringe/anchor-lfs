name: Quality

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_call:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Verify go.mod is tidy
        run: |
          make tidy
          git diff --exit-code go.mod go.sum tools/go.mod tools/go.sum

      - name: Verify no local replace directive
        run: |
          if grep -q '^replace.*' go.mod; then
            echo "ERROR: go.mod contains an active replace directive."
            echo "Remove or comment it out before releasing."
            exit 1
          fi

      - name: Vet
        run: make vet

      - name: Lint
        run: make lint
