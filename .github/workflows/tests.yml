name: Tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_call:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: make test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Generate coverage
        run: make test-cover

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  s3-integration:
    name: S3 Integration
    runs-on: ubuntu-latest
    env:
      ANCHOR_LFS_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      ANCHOR_LFS_TEST_S3_ACCESS_KEY_ID: anchortest
      ANCHOR_LFS_TEST_S3_SECRET_ACCESS_KEY: anchortestsecret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Start RustFS
        run: |
          docker run -d --name rustfs -p 127.0.0.1:9000:9000 \
            -e RUSTFS_ACCESS_KEY="$ANCHOR_LFS_TEST_S3_ACCESS_KEY_ID" \
            -e RUSTFS_SECRET_KEY="$ANCHOR_LFS_TEST_S3_SECRET_ACCESS_KEY" \
            rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
          timeout 60 sh -c 'until curl -sf "$ANCHOR_LFS_TEST_S3_ENDPOINT/health" > /dev/null; do sleep 1; done'

      - name: Test
        run: go test -race -v -run TestS3Integration ./storage/

      - name: RustFS logs
        if: failure()
        run: docker logs rustfs
