services:
  anchor-lfs:
    build: .
    ports:
      - '5420:5420'
    volumes:
      # On Linux hosts, create the data directory owned by the image's anchor user first:
      # mkdir -p data && sudo chown 100:101 data
      - ./data:/app/data
      - ./config.toml:/app/config.toml:ro
    environment:
      - ANCHOR_LFS_LISTEN=:5420
    restart: unless-stopped
    # Keep above shutdown_timeout (default 30s).
    stop_grace_period: 45s
