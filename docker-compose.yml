services:
  anchor-lfs:
    # Pin a release such as 0.1 in production. For a local build, run `make docker-build` and use: image: anchor-lfs
    image: ghcr.io/refringe/anchor-lfs:latest
    ports:
      - '5420:5420'
    volumes:
      # On Linux hosts, create the data directory owned by the image's anchor user first:
      # mkdir -p data && sudo chown 100:101 data
      - ./data:/app/data
      - ./config.toml:/app/config.toml:ro
    environment:
      - ANCHOR_LFS_LISTEN=:5420
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # Keep above shutdown_timeout (default 30s).
    stop_grace_period: 45s
